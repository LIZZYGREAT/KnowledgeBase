services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      KNOWLEDGE_REPO_PATH: /workspace
      DATABASE_PATH: /workspace/runtime/knowledge.db
      KB_BACKUP_PATH: /backups
      KB_GIT_USER_NAME: ${KB_GIT_USER_NAME:-KnowledgeBase}
      KB_GIT_USER_EMAIL: ${KB_GIT_USER_EMAIL:-knowledgebase@localhost}
    volumes:
      - .:/workspace
      - ${KB_IMPORT_DIRECTORY:-./storage/uploads}:/imports:ro
      - ${KB_BACKUP_DIRECTORY:-../KnowledgeBase-backups}:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${KB_HTTP_BIND:-127.0.0.1}:${KB_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
