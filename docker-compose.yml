services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KNOWLEDGE_REPO_PATH: ${KNOWLEDGE_REPO_PATH:-/workspace}
      DATABASE_PATH: ${DATABASE_PATH:-/workspace/runtime/knowledge.db}
    volumes:
      - .:/workspace

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
