services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      KNOWLEDGE_REPO_PATH: ${KNOWLEDGE_REPO_PATH:-/workspace}
      DATABASE_PATH: ${DATABASE_PATH:-/workspace/runtime/knowledge.db}
      KB_GIT_USER_NAME: ${KB_GIT_USER_NAME:-KnowledgeBase}
      KB_GIT_USER_EMAIL: ${KB_GIT_USER_EMAIL:-knowledgebase@localhost}
    volumes:
      - .:/workspace

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
