schema_version: 1

id: continual-learning
title: Continual Learning
description: 持续学习、灾难性遗忘以及相关缓解方法。
enabled: true

lenses:
  - id: regularization
    title: 正则化方法
    enabled: true
    priority: high
    queries:
      - elastic weight consolidation
      - parameter importance continual learning
      - fisher information catastrophic forgetting
    include_terms:
      - fisher information
      - parameter importance
      - regularization
    exclude_terms: []

  - id: replay
    title: Replay / Rehearsal
    enabled: true
    priority: medium
    queries:
      - replay continual learning
      - experience replay catastrophic forgetting
    include_terms:
      - replay
      - rehearsal
    exclude_terms: []

  - id: class-incremental
    title: Class-Incremental Learning
    enabled: true
    priority: high
    queries:
      - class incremental continual learning
      - nearest class mean class incremental learning
    include_terms: []
    exclude_terms: []

  - id: distillation
    title: 蒸馏与无遗忘学习
    enabled: true
    priority: medium
    queries:
      - learning without forgetting knowledge distillation continual learning
    include_terms: []
    exclude_terms: []

  - id: gradient-episodic-memory
    title: Gradient Episodic Memory
    enabled: true
    priority: high
    queries:
      - gradient episodic memory A-GEM continual learning
    include_terms: []
    exclude_terms: []

exclude_terms:
  - pure domain adaptation

providers:
  discovery:
    - arxiv
    - openalex
  enrichment:
    - openalex
    - crossref

context:
  collections: []
  documents: []
  dynamic_retrieval:
    enabled: true
    scope: entire-library

schedule:
  mode: daily

search:
  breadth: balanced
  history_seed_year: 2017
  initial_lookback_days: 30
  max_catchup_days: 30
  max_candidates_per_run: 10
  max_analyses_per_run: 30

inbox:
  max_new_candidates: 20

ai_analysis:
  enabled: true
  provider: deepseek
