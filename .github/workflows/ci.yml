name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check backend entrypoint syntax
        run: sh -n backend/entrypoint.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check canonical knowledge
        run: python tools/kb.py check

      - name: Rebuild indexes in a temporary database
        run: python tools/kb.py rebuild --database "$RUNNER_TEMP/knowledge.db"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run frontend integration tests
        working-directory: frontend
        run: npm run test:integration

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config -q

      - name: Check patch whitespace
        run: >
          git diff --check HEAD^ HEAD --
          .
          ':(exclude)knowledge/documents/**'
          ':(exclude)knowledge/terms/**'
